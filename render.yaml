services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/schema/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,127.0.0.1,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: https://volt-store.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://volt-store.vercel.app
      - key: FRONTEND_URL
        value: https://volt-store.vercel.app
      - key: POSTGRES_HOST
        fromDatabase:
          name: ecommerce-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: ecommerce-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: ecommerce-db
          property: user
      - key: POSTGRES_DB
        fromDatabase:
          name: ecommerce-db
          property: database
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ecommerce-db
          property: password
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce